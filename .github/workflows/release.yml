name: macOS release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run check
      - name: Build app and DMG
        run: bun run tauri:build
      - name: Sign app ad-hoc
        run: codesign --force --deep --sign - src-tauri/target/release/bundle/macos/getaroom.app
      - name: Package signed app in DMG
        run: |
          rm -f src-tauri/target/release/bundle/dmg/*.dmg
          hdiutil create -ov -fs HFS+ -volname getaroom -srcfolder src-tauri/target/release/bundle/macos/getaroom.app "src-tauri/target/release/bundle/dmg/getaroom-${GITHUB_REF_NAME}.dmg"
      - name: Publish DMG
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
